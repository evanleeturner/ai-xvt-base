# z_bop's functions in Rust by the one-shot route: a static
# library the side-by-side checker's Rust arm, tools/side_by_side_rust.py,
# links into its probe.
[package]
name = "z_bop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]
test = false
bench = false

# A panic aborts; LTO folds core into the crate's one object, so a build
# exports the ported functions and nothing two builds in one probe could share.
# Overflow checks trap as the checker's UB slot expects, but debug
# assertions are off: core's null and alignment checks would trap ud2 on a
# NULL argument where the original raises an access violation.
[profile.dev]
panic = "abort"
debug-assertions = false
overflow-checks = true
lto = true
codegen-units = 1

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
